services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowwatch
      POSTGRES_USER: flowwatch
      POSTGRES_PASSWORD: flowwatch
    ports:
      - "5433:5432"
    volumes:
      - flowwatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowwatch -d flowwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowwatch-data:
